[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pidjepa"
version = "2.0.0"
description = "PID-JEPA: partial information decomposition of multimodal joint-embedding pretraining (D-JEPA vs. alignment-only; synthetic + CLEVR) in JAX/Flax"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The PID-JEPA Authors" }]
keywords = [
    "representation-learning",
    "joint-embedding",
    "partial-information-decomposition",
    "multimodal",
    "clevr",
    "jax",
    "flax",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "flax>=0.10",
    "optax>=0.2.3",
    "orbax-checkpoint>=0.5",
    "grain>=0.2.6",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
data = ["torch>=2.0", "h5py>=3.8", "gdown>=5.1"]
# Optional frozen feature-extraction towers for the real CLEVR benchmark.
clevr = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "datasets>=2.18",
]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
pidjepa = "pidjepa.main:main"

# The source files live directly in ``src/`` but are installed as the
# ``pidjepa`` package, so imports remain ``from pidjepa.models import ...``.
[tool.setuptools]
packages = [
    "pidjepa",
    "pidjepa.data",
    "pidjepa.data.synthetic",
    "pidjepa.eval",
    "pidjepa.losses",
    "pidjepa.models",
    "pidjepa.train",
    "pidjepa.utils",
    "pidjepa.utils.pid",
]
package-dir = { pidjepa = "src" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
