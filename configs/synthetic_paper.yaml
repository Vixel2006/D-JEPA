# The synthetic ground-truth benchmark with known shared, private, and
# synergistic information atoms.
data:
  mode: synthetic
  synthetic_samples: 5000
  views: 3
  clevr_split_seed: 1234

model:
  block_dim: 64
  hidden_dim: 512
  transformer_dim: 256
  transformer_layers: 2
  attention_heads: 4

optim:
  pretrain_steps: 3000
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_fraction: 0.05
  clip_norm: 1.0
  checkpoint_every: 1000
  keep_checkpoints: 2

objective:
  sigreg_weight: 0.05
  invariance_weight: 1.0
  cross_modal_weight: 1.0
  reconstruction_weight: 1.0
  independence_weight: 0.2
  sigreg_slices: 256
  sigreg_max_frequency: 3.0
  sigreg_points: 17

evaluation:
  probe_epochs: 60
  probe_hidden_dim: 256
  probe_batch_size: 256
  probe_patience: 8
  probe_learning_rate: 0.001
  probe_weight_decay: 0.01
  pid_dim: 64
  pid_steps: 400
  flow_pid: true
  flow_hidden_dim: 128
  flow_layers: 4
  flow_learning_rate: 0.002

run:
  seeds: 3
  seed_start: 42
  output_dir: results/synthetic_paper
  save_checkpoints: true
  make_figures: true
  log_level: INFO
