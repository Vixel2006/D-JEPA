seed: 0
seeds: [0]
output_dir: runs
experiment_name: synthetic_decomposition
objective: decomposition

wandb:
  project: djepa
  mode: online

data:
  dataset: synthetic
  n_samples: 1024
  max_text_length: 128
  tokenizer: bert-base-uncased
  text_mask_probability: 0.08

model:
  image_size: 128
  proj_dim: 128

training:
  batch_size: 16
  num_workers: 0
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.05

loss:
  alignment: 1.0
  independence: 1.0
  sigreg: 0.05
