seed: 0
seeds: [42, 43, 44]
output_dir: runs
experiment_name: flickr30k_djepa
objective: decomposition

wandb:
  project: pidjepa
  mode: online

data:
  dataset: flickr30k
  max_text_length: 64
  tokenizer: bert-base-uncased
  text_mask_probability: 0.08

model:
  image_size: 128
  proj_dim: 128

training:
  batch_size: 64
  num_workers: 4
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.05

loss:
  alignment: 1.0
  independence: 1.0
  sigreg: 0.05

evaluation:
  enabled: true
  epochs: 20
  learning_rate: 0.001
  hidden_dim: 256
  batch_size: 256
  temperature: 0.07
