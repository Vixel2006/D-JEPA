seed: 0
seeds: [42, 43, 44]
output_dir: runs
experiment_name: mm_imdb_djepa
objective: decomposition
run_mode: train

wandb:
  project: pidjepa
  mode: online

data:
  dataset: mm_imdb
  max_text_length: 256
  tokenizer: bert-base-uncased
  text_mask_probability: 0.08
  cache_images: true
  cache_dir: runs/image_cache

model:
  image_size: 128
  proj_dim: 128

training:
  batch_size: 128
  num_workers: 4
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.05

loss:
  alignment: 1.0
  independence: 1.0
  sigreg: 0.05

evaluation:
  data_batch_size: 128
  epochs: 20
  learning_rate: 0.001
  hidden_dim: 256
  batch_size: 256
  temperature: 0.07
