# Tiny end-to-end smoke profile: exercises both architectures, probes,
# PID (probe-only), checkpointing, metrics, tables, and figures.
data:
  mode: synthetic
  synthetic_samples: 128
  views: 3

model:
  block_dim: 8
  hidden_dim: 32
  transformer_dim: 32
  transformer_layers: 1
  attention_heads: 2

optim:
  pretrain_steps: 2
  batch_size: 8
  learning_rate: 0.001
  checkpoint_every: 1
  keep_checkpoints: 1

objective:
  sigreg_slices: 8
  sigreg_points: 17

evaluation:
  probe_epochs: 1
  probe_hidden_dim: 16
  probe_batch_size: 32
  pid_dim: 4
  pid_steps: 2
  flow_pid: false
  flow_hidden_dim: 8
  flow_layers: 1

run:
  seeds: 1
  output_dir: outputs/smoke_synthetic
  save_checkpoints: true
  make_figures: true
  log_level: INFO
