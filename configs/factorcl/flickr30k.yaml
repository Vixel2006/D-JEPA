seed: 0
seeds: [0]
output_dir: runs
experiment_name: flickr30k_factorcl
objective: factorcl

wandb:
  project: pidjepa
  mode: online

data:
  dataset: flickr30k
  max_text_length: 64
  tokenizer: bert-base-uncased
  text_mask_probability: 0.08
  cache_images: true
  cache_dir: runs/image_cache

model:
  image_size: 128
  proj_dim: 128

training:
  batch_size: 32
  num_workers: 4
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.05

factorcl:
  critic_hidden_dim: 512
  num_critic_steps: 5
  weight_decay: 0.0
